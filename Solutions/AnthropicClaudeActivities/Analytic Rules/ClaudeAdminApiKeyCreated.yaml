id: f69a5c91-882b-42c9-b8d6-d0a4eecb13e6
name: Claude - Admin API key created or scope-escalated
description: |
  'Detects creation of a new Claude Admin API key, or an update to an existing one that grants
  additional scopes. Admin API keys can manage users, invites, workspaces, and other API keys,
  so an unexpected creation or a widening of scopes is a high-value signal for privilege
  escalation or persistence in a Claude Enterprise organization.'
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AnthropicClaudeActivitiesCCFDefinition
    dataTypes:
      - ClaudeActivity_CL
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1098
  - T1078
query: |
  ClaudeActivity
  | where ActivityType in ("admin_api_key_created", "admin_api_key_updated")
  | extend GrantedScopes = tostring(Scopes), AppliedUpdates = tostring(Updates)
  | where ActivityType == "admin_api_key_created" or AppliedUpdates has "scope"
  | project
      TimeGenerated,
      ActivityType,
      AdminApiKeyId,
      GrantedScopes,
      AppliedUpdates,
      ActorType,
      ActorDisplayName,
      ActorId,
      ActorEmailAddress,
      ActorIpAddress,
      OrganizationId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: ActorDisplayName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ActorIpAddress
version: 1.0.0
kind: Scheduled
